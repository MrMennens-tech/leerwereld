<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeerWereld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ALGEMENE STIJLEN EN CSS VARIABELEN --- */
        :root {
            --font-family: 'Poppins', sans-serif;
            --bg-color: #e0f7fa;
            --primary-color: #0077c2;
            --secondary-color: #004d7a;
            --accent-color: #ffc107;
            --text-color: #0d4d7a;
            --card-bg: #ffffff;
            --card-shadow: rgba(0, 77, 122, 0.2);
            --highlight-border: 6px solid #ffeb3b;
            --bg-image: url('https://www.transparenttextures.com/patterns/wavecut.png');
            --element-size-multiplier: 1.0; /* Nieuwe variabele voor grootte */
        }

        /* --- THEMA'S --- */
        body[data-theme="jungle"] { --bg-color: #e8f5e9; --primary-color: #2e7d32; --secondary-color: #1b5e20; --accent-color: #ff6f00; --text-color: #1b5e20; --card-shadow: rgba(46, 125, 50, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/natural-paper.png'); }
        body[data-theme="farm"] { --bg-color: #fffde7; --primary-color: #c62828; --secondary-color: #8e0000; --accent-color: #4caf50; --text-color: #bf360c; --card-shadow: rgba(198, 40, 40, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/checkered-pattern.png'); }
        body[data-theme="space"] { --bg-color: #1a237e; --primary-color: #bbdefb; --secondary-color: #e3f2fd; --accent-color: #fdd835; --text-color: #ffffff; --card-bg: #3f51b5; --card-shadow: rgba(255, 255, 255, 0.1); --bg-image: url('https://www.transparenttextures.com/patterns/stardust.png'); }
        body[data-theme="christmas"] { --bg-color: #fce4ec; --primary-color: #ad1457; --secondary-color: #880e4f; --accent-color: #fdd835; --text-color: #880e4f; --card-shadow: rgba(136, 14, 79, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/snow.png'); }
        body[data-theme="autumn"] { --bg-color: #fff3e0; --primary-color: #e65100; --secondary-color: #bf360c; --accent-color: #8d6e63; --text-color: #bf360c; --card-shadow: rgba(230, 81, 0, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/sos.png'); }
        body[data-theme="spring"] { --bg-color: #e8f5e9; --primary-color: #ff80ab; --secondary-color: #f50057; --accent-color: #8bc34a; --text-color: #c51162; --card-shadow: rgba(245, 0, 87, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/flowers.png'); }
        body[data-theme="summer"] { --bg-color: #e3f2fd; --primary-color: #f57c00; --secondary-color: #0277bd; --accent-color: #ffeb3b; --text-color: #f57c00; --card-shadow: rgba(245, 124, 0, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/sun.png'); }
        body[data-theme="winter"] { --bg-color: #e0e0e0; --primary-color: #455a64; --secondary-color: #263238; --accent-color: #81d4fa; --text-color: #263238; --card-shadow: rgba(69, 90, 100, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/ice-age.png'); }
        body[data-theme="sport"] { --bg-color: #e0f2f1; --primary-color: #00695c; --secondary-color: #004d40; --accent-color: #ffab00; --text-color: #004d40; --card-shadow: rgba(0, 77, 64, 0.2); --bg-image: url('https://www.transparenttextures.com/patterns/lined-paper.png'); }

        body[data-contrast="high"] { --bg-color: #000; --primary-color: #fff; --secondary-color: #000; --accent-color: #ff0; --text-color: #fff; --card-bg: #000; --card-shadow: rgba(255, 255, 255, 0.5); --highlight-border: 8px solid #0ff; --bg-image: none; }
        body[data-contrast="high"] .setting-button.active { background-color: var(--accent-color); color: #000; border-color: var(--accent-color); }

        /* --- BASISSTRUCTUUR & UI ELEMENTEN --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { height: 100%; font-family: var(--font-family); background-color: var(--bg-color); background-image: var(--bg-image); color: var(--text-color); transition: background-color 0.5s ease, color 0.5s ease; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; padding: 2vmin; }
        .view { display: none; flex-grow: 1; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .view.active { display: flex; }
        .main-header h1 { font-size: clamp(2.5rem, 8vmin, 5rem); font-weight: 700; color: var(--secondary-color); text-align: center; margin-bottom: 4vmin; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(150px, 20vmin, 220px), 1fr)); gap: 3vmin; width: 100%; max-width: 1400px; padding: 2vmin; }
        .game-card { background-color: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 20px var(--card-shadow); aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; border: 6px solid transparent; text-align: center; padding: 1vmin; }
        .game-card:hover { transform: translateY(-5px); }
        .game-card .icon { font-size: clamp(2.5rem, 8vmin, 5rem); margin-bottom: 1vmin; }
        .game-card h2 { font-size: clamp(1rem, 3vmin, 1.6rem); font-weight: 600; }
        .scannable.scan-highlight { outline: var(--highlight-border); outline-offset: 4px; transform: scale(1.05); box-shadow: 0 0 30px var(--accent-color); }
        .ui-button { background-color: var(--primary-color); color: var(--card-bg); border: none; border-radius: 50%; width: clamp(50px, 10vmin, 80px); height: clamp(50px, 10vmin, 80px); font-size: clamp(24px, 5vmin, 40px); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px var(--card-shadow); transition: transform 0.2s ease; border: 4px solid transparent; }
        .top-bar { position: absolute; top: 2vmin; right: 2vmin; left: 2vmin; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        #settings-view .settings-container { background-color: var(--card-bg); padding: 4vmin; border-radius: 20px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .setting-group { margin-bottom: 3vmin; }
        .setting-group h3 { font-size: clamp(1.2rem, 4vmin, 1.8rem); margin-bottom: 1.5vmin; border-bottom: 2px solid var(--primary-color); padding-bottom: 1vmin; }
        .setting-group p { font-size: clamp(0.9rem, 2vmin, 1.1rem); margin-top: -1vmin; margin-bottom: 1.5vmin; opacity: 0.8;}
        .setting-options { display: flex; flex-wrap: wrap; gap: 1.5vmin; }
        .setting-button { flex-grow: 1; padding: 1.5vmin 2.5vmin; border: 3px solid var(--primary-color); background-color: transparent; color: var(--primary-color); border-radius: 12px; font-size: clamp(1rem, 2.5vmin, 1.4rem); cursor: pointer; }
        .setting-button.active { background-color: var(--primary-color); color: var(--card-bg); }
        #game-view { padding-top: calc(10vmin + 2vmin); }
        .game-area { flex-grow: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; background-size: cover; background-position: center; transition: background-image 0.5s ease-in-out; }
        .game-feedback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); font-size: 20vmin; opacity: 0; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease; pointer-events: none; z-index: 200; }
        .game-feedback.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        /* --- SPELSPECIFIEKE STIJLEN --- */
        /* Ontdek en Tik */
        #interactive-scene-container { width: 100%; height: 100%; position: relative; }
        .interactive-object { position: absolute; font-size: calc(12vmin * var(--element-size-multiplier)); cursor: pointer; transition: opacity 0.5s ease, transform 0.5s ease; }
        .interactive-object.hidden { opacity: 0; transform: scale(0.8); pointer-events: none; }
        @keyframes launch { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
        .interactive-object.animate-launch { animation: launch 1.5s ease-in forwards; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(0); opacity: 0; } }
        .interactive-object.animate-pop { animation: pop 0.5s ease-out forwards; }
        @keyframes drive-off { 0% { transform: translateX(0); } 100% { transform: translateX(100vw); } }
        .interactive-object.animate-drive-off { animation: drive-off 2s linear forwards; }

        /* Vliegende Vangers */
        .moving-target { position: absolute; font-size: calc(10vmin * var(--element-size-multiplier)); cursor: pointer; transition: transform 0.2s ease; }
        .moving-target.caught { transform: scale(0); }
        
        /* Memory */
        #memory-grid { display: grid; gap: calc(2vmin * var(--element-size-multiplier)); }
        .memory-card { background-color: var(--primary-color); border-radius: 15px; cursor: pointer; aspect-ratio: 1/1; position: relative; transform-style: preserve-3d; transition: transform 0.5s; width: calc(15vmin * var(--element-size-multiplier)); }
        .memory-card.flipped, .memory-card.matched { transform: rotateY(180deg); pointer-events: none; }
        .memory-card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 80%; }
        .memory-card-back { background-color: var(--primary-color); }
        .memory-card-front { background-color: var(--card-bg); transform: rotateY(180deg); }
        
        /* Hetzelfde of Anders */
        #sod-container { display: flex; flex-direction: column; align-items: center; gap: 5vmin; }
        #sod-reference-area { border: 5px dashed var(--primary-color); padding: 2vmin; border-radius: 20px; }
        .sod-object { font-size: clamp(calc(8rem * var(--element-size-multiplier)), calc(15vmin * var(--element-size-multiplier)), calc(12rem * var(--element-size-multiplier))); width: auto; height: auto; }
        #sod-choice-area { display: flex; gap: 4vmin; flex-wrap: wrap; justify-content: center; }
        .sod-choice-card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 20px var(--card-shadow); cursor: pointer; border: 6px solid transparent; transition: transform 0.2s ease; padding: calc(1vmin * var(--element-size-multiplier)); }
        .sod-choice-card:hover { transform: translateY(-5px); }

        /* Tellen */
        #counting-container { display: flex; flex-direction: column; align-items: center; gap: 3vmin; }
        #counting-display { font-size: calc(15vmin * var(--element-size-multiplier)); font-weight: 700; }
        #counting-target-area { border: 5px dashed var(--primary-color); border-radius: 20px; min-height: 25vmin; width: 80%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding: 2vmin; gap: 2vmin; }
        #counting-source-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 2vmin; margin-top: 2vmin; }
        .counting-object { font-size: calc(8vmin * var(--element-size-multiplier)); cursor: pointer; transition: transform 0.2s ease; }
        .counting-object:hover { transform: scale(1.1); }

        /* Rekenen */
        #math-container { text-align: center; }
        #math-problem-area { display: flex; align-items: center; justify-content: center; gap: 2vmin; font-size: calc(8vmin * var(--element-size-multiplier)); font-weight: 600; margin-bottom: 4vmin; flex-wrap: wrap;}
        .math-object-group { display: flex; flex-wrap: wrap; gap: 1vmin; }
        .math-object { font-size: calc(6vmin * var(--element-size-multiplier)); }
        #math-answer-area { display: flex; gap: 3vmin; justify-content: center; }
        .math-answer-btn { padding: calc(3vmin * var(--element-size-multiplier)); font-size: calc(8vmin * var(--element-size-multiplier)); font-weight: 700; border-radius: 20px; background-color: var(--card-bg); box-shadow: 0 5px 15px var(--card-shadow); cursor: pointer; min-width: calc(15vmin * var(--element-size-multiplier)); }

    </style>
</head>
<body data-theme="sea" data-contrast="normal" data-focus-mode="false">
    <div class="app-container">
        <!-- VIEWS -->
        <div id="main-menu-view" class="view active">
            <header class="main-header"> <h1>LeerWereld</h1> </header>
            <div class="game-grid">
                <div class="game-card scannable" data-game="interactive-scene"> <div class="icon">👆</div> <h2>Ontdek en Tik</h2> </div>
                <div class="game-card scannable" data-game="moving-targets"> <div class="icon">🎯</div> <h2>Vliegende Vangers</h2> </div>
                <div class="game-card scannable" data-game="same-or-different"> <div class="icon">🎨</div> <h2>Hetzelfde of Anders</h2> </div>
                <div class="game-card scannable" data-game="counting"> <div class="icon">🔢</div> <h2>Tellen</h2> </div>
                <div class="game-card scannable" data-game="math"> <div class="icon">➕</div> <h2>Rekenen</h2> </div>
                <div class="game-card scannable" data-game="memory"> <div class="icon">🧠</div> <h2>Memory</h2> </div>
                <div class="game-card scannable" id="open-settings-from-main"> <div class="icon">⚙️</div> <h2>Instellingen</h2> </div>
            </div>
        </div>
        <div id="game-view" class="view">
            <div class="top-bar">
                <button id="back-to-main-button" class="ui-button scannable" aria-label="Terug naar hoofdmenu">◀</button>
                <div id="game-level-selector" class="setting-options"></div>
                <button id="open-settings-from-game" class="ui-button scannable" aria-label="Open instellingen">⚙️</button>
            </div>
            <div class="game-area"></div>
            <div class="game-feedback"></div>
        </div>
        <div id="settings-view" class="view">
             <div class="top-bar"> <button id="close-settings-button" class="ui-button scannable" aria-label="Sluit instellingen">◀</button> </div>
             <div class="settings-container">
                <h2>Instellingen</h2>
                <div class="setting-group">
                    <h3>Thema</h3>
                    <div id="theme-options" class="setting-options">
                        <button class="setting-button scannable" data-setting="theme" data-value="sea">Zee</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="jungle">Jungle</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="farm">Boerderij</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="space">Ruimte</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="spring">Lente</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="summer">Zomer</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="autumn">Herfst</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="winter">Winter</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="christmas">Kerst</button>
                        <button class="setting-button scannable" data-setting="theme" data-value="sport">Sport</button>
                    </div>
                </div>
                <div class="setting-group">
                    <h3>Toegankelijkheid</h3>
                    <div id="input-mode-options" class="setting-options">
                        <button class="setting-button scannable" data-setting="inputMode" data-value="touch">Touch/Muis</button>
                        <button class="setting-button scannable" data-setting="inputMode" data-value="one-button">Eénknops</button>
                        <button class="setting-button scannable" data-setting="inputMode" data-value="two-button">Tweeknops</button>
                    </div>
                    <div class="slider-container" style="margin-top:2vmin;">
                        <label for="scan-speed-slider">Scansnelheid:</label>
                        <input type="range" id="scan-speed-slider" class="scannable" min="1" max="5" step="0.5" data-setting="scanSpeed">
                        <span id="scan-speed-value">3.0s</span>
                    </div>
                </div>
                 <div class="setting-group">
                    <h3>Grootte Elementen</h3>
                    <div class="slider-container">
                        <label for="element-size-slider">Schaal:</label>
                        <input type="range" id="element-size-slider" class="scannable" min="0.8" max="2.0" step="0.1" data-setting="elementSize">
                        <span id="element-size-value">1.0x</span>
                    </div>
                </div>
                <div class="setting-group">
                    <h3>Scan Modus</h3>
                    <p>Kies welke elementen worden opgenomen in de scan.</p>
                    <div id="scan-scope-options" class="setting-options">
                        <button class="setting-button scannable" data-setting="scanScope" data-value="full">Volledige Controle</button>
                        <button class="setting-button scannable" data-setting="scanScope" data-value="game-only">Enkel Spel</button>
                    </div>
                </div>
                <div class="setting-group">
                    <h3>Visueel</h3>
                    <div id="visual-options" class="setting-options">
                        <button class="setting-button scannable" data-setting="focusMode" data-value="false">Standaard</button>
                        <button class="setting-button scannable" data-setting="focusMode" data-value="true">Focus</button>
                        <button class="setting-button scannable" data-setting="contrast" data-value="normal">Normaal</button>
                        <button class="setting-button scannable" data-setting="contrast" data-value="high">Hoog Contrast</button>
                    </div>
                </div>
                <div class="setting-group">
                    <h3>Feedback</h3>
                    <div id="feedback-options" class="setting-options">
                        <button class="setting-button scannable" data-setting="feedbackMode" data-value="both">Alles</button>
                        <button class="setting-button scannable" data-setting="feedbackMode" data-value="visual">Visueel</button>
                        <button class="setting-button scannable" data-setting="feedbackMode" data-value="audio">Auditief</button>
                    </div>
                </div>
                <div class="setting-group">
                    <h3>Stem (TTS)</h3>
                    <div id="tts-voice-options" class="setting-options">
                        <button class="setting-button scannable" data-setting="voice" data-value="female">Vrouw</button>
                        <button class="setting-button scannable" data-setting="voice" data-value="male">Man</button>
                    </div>
                </div>
             </div>
        </div>
    </div>

    <script type="module">
        // --- APPLICATIE STATE EN CONSTANTEN ---
        const AppState = { currentView: 'main-menu-view', previousView: null, activeGame: null, activeLevel: 1 };
        const DOM = {
            views: document.querySelectorAll('.view'),
            gameArea: document.querySelector('.game-area'),
            gameFeedback: document.querySelector('.game-feedback'),
            levelSelector: document.getElementById('game-level-selector'),
            body: document.body,
            settingsContainer: document.querySelector('#settings-view .settings-container')
        };
        
        // --- HULPFUNCTIES ---
        const Utils = {
            getThemeItems: () => {
                const themes = {
                    sea: { name: 'vis', background: 'linear-gradient(to bottom, #89cff0, #005c99)', items: [{i:'🐠',n:'vis'}, {i:'🦀',n:'krab'}, {i:'🐙',n:'octopus'}, {i:'🐳',n:'walvis'}, {i:'🐬',n:'dolfijn'}, {i:'⭐',n:'ster'}], scenes: {pop: {i:'🐙',n:'octopus'}, drive: {i:'🐠',n:'vis',s:'plons'}} },
                    jungle: { name: 'aap', background: 'linear-gradient(to bottom, #298c1f, #0f3d0a)', items: [{i:'🐵',n:'aap'}, {i:'🦁',n:'leeuw'}, {i:'🐘',n:'olifant'}, {i:'🐍',n:'slang'}, {i:'🦜',n:'papegaai'}, {i:'🍌',n:'banaan'}], scenes: {pop: {i:'🍌',n:'banaan'}, drive: {i:'🦁',n:'leeuw'}} },
                    farm: { name: 'koe', background: 'linear-gradient(to bottom, #a1d48c, #5c9145)', items: [{i:'🐮',n:'koe'}, {i:'🐷',n:'varken'}, {i:'🐔',n:'kip'}, {i:'🐑',n:'schaap'}, {i:'🐴',n:'paard'}, {i:'🚜',n:'tractor'}], scenes: {pop: {i:'🐔',n:'kip'}, drive: {i:'🚜',n:'tractor'}} },
                    space: { name: 'raket', background: 'radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%)', items: [{i:'🚀',n:'raket'}, {i:'👽',n:'alien'}, {i:'🪐',n:'planeet'}, {i:'⭐',n:'ster'}, {i:'☄️',n:'komeet'}, {i:'🛰️',n:'satelliet'}], scenes: {pop: {i:'👽',n:'alien'}, launch: {i:'🚀',n:'raket', s:'lancering'}} },
                    christmas: { name: 'kerstboom', background: 'radial-gradient(circle, #fff, #d4e4f3)', items: [{i:'🎄',n:'kerstboom'}, {i:'🎅',n:'kerstman'}, {i:'🦌',n:'rendier'}, {i:'🎁',n:'cadeau'}, {i:'🔔',n:'kerstbel'}, {i:'⛄',n:'sneeuwpop'}], scenes: {pop: {i:'🎁',n:'cadeau'}, drive: {i:'🎅',n:'kerstman'}} },
                    autumn: { name: 'blad', background: 'linear-gradient(to bottom, #d2a679, #8c5a2b)', items: [{i:'🍁',n:'esdoornblad'}, {i:'🍂',n:'blad'}, {i:'🍄',n:'paddenstoel'}, {i:'🎃',n:'pompoen'}, {i:'🐿️',n:'eekhoorn'}, {i:'🌰',n:'kastanje'}], scenes: {pop: {i:'🎃',n:'pompoen'}, drive: {i:'🐿️',n:'eekhoorn'}} },
                    spring: { name: 'bloem', background: 'linear-gradient(to bottom, #c1f1ac, #78c48a)', items: [{i:'🌸',n:'bloesem'}, {i:'🌷',n:'tulp'}, {i:'🦋',n:'vlinder'}, {i:'🐞',n:'lieveheersbeestje'}, {i:'🌱',n:'plantje'}, {i:'🐣',n:'kuiken'}], scenes: {pop: {i:'🐣',n:'kuiken'}, drive: {i:'🦋',n:'vlinder'}} },
                    summer: { name: 'zon', background: 'linear-gradient(to bottom, #ffeca7, #ffb13d)', items: [{i:'☀️',n:'zon'}, {i:'🍦',n:'ijsje'}, {i:'🏖️',n:'strand'}, {i:'🍉',n:'watermeloen'}, {i:'🕶️',n:'zonnebril'}, {i:'⛵',n:'zeilboot'}], scenes: {pop: {i:'🍉',n:'watermeloen'}, drive: {i:'⛵',n:'zeilboot'}} },
                    winter: { name: 'sneeuwvlok', background: '#ffffff', items: [{i:'❄️',n:'sneeuwvlok'}, {i:'🧤',n:'wanten'}, {i:'🧣',n:'sjaal'}, {i:'⛸️',n:'schaats'}, {i:'🥶',n:'koud'}, {i:'🧥',n:'jas'}], scenes: {pop: {i:'⛄',n:'sneeuwpop'}, drive: {i:'⛸️',n:'schaats'}} },
                    sport: { name: 'bal', background: 'linear-gradient(to bottom, #63d471, #238b32)', items: [{i:'⚽',n:'voetbal'}, {i:'🏀',n:'basketbal'}, {i:'🏈',n:'rugbybal'}, {i:'⚾',n:'honkbal'}, {i:'🎾',n:'tennisbal'}, {i:'🏆',n:'beker'}], scenes: {pop: {i:'⚽',n:'voetbal',s:'schot'}, drive: {i:'🏆',n:'beker'}} }
                };
                return themes[Settings.state.theme] || themes['sea'];
            },
            shuffleArray: (array) => array.sort(() => Math.random() - 0.5)
        };
        
        const Settings = {
            state: { theme: 'sea', inputMode: 'touch', scanSpeed: 3.0, scanScope: 'full', focusMode: false, contrast: 'normal', feedbackMode: 'both', voice: 'female', elementSize: 1.0 },
            init() { this.load(); this.applyAll(); this.updateUI(); DOM.settingsContainer.addEventListener('click', e => { const btn = e.target.closest('.setting-button'); if(btn && btn.dataset.setting) this.handleButtonClick(e, btn.dataset.setting); }); const scanSlider = document.getElementById('scan-speed-slider'); scanSlider.addEventListener('input', e => { this.state.scanSpeed = parseFloat(e.target.value); document.getElementById('scan-speed-value').textContent = `${this.state.scanSpeed.toFixed(1)}s`; }); scanSlider.addEventListener('change', () => this.save()); const sizeSlider = document.getElementById('element-size-slider'); sizeSlider.addEventListener('input', e => { this.state.elementSize = parseFloat(e.target.value); this.apply('elementSize'); document.getElementById('element-size-value').textContent = `${this.state.elementSize.toFixed(1)}x`; }); sizeSlider.addEventListener('change', () => this.save()); },
            handleButtonClick(event, key) { const btn = event.target.closest('.setting-button'); if (!btn) return; const val = btn.dataset.value; this.state[key] = val === 'true' ? true : (val === 'false' ? false : val); this.apply(key); this.updateUI(); this.save(); TTS.speak(btn.textContent); Accessibility.restartScanIfActive(); },
            save() { localStorage.setItem('leerwereld_settings', JSON.stringify(this.state)); },
            load() { const saved = localStorage.getItem('leerwereld_settings'); if (saved) { this.state = { ...this.state, ...JSON.parse(saved) }; } },
            apply(key) { if (key === 'elementSize') { document.documentElement.style.setProperty('--element-size-multiplier', this.state.elementSize); } else { DOM.body.dataset[key] = this.state[key]; } if (key === 'inputMode') Accessibility.setInputMode(this.state.inputMode); if (key === 'scanScope') Accessibility.restartScanIfActive(); },
            applyAll() { for (const key in this.state) this.apply(key); },
            updateUI() { document.querySelectorAll('.setting-button').forEach(btn => btn.classList.toggle('active', String(this.state[btn.dataset.setting]) === btn.dataset.value)); document.getElementById('scan-speed-slider').value = this.state.scanSpeed; document.getElementById('scan-speed-value').textContent = `${this.state.scanSpeed.toFixed(1)}s`; document.getElementById('element-size-slider').value = this.state.elementSize; document.getElementById('element-size-value').textContent = `${this.state.elementSize.toFixed(1)}x`; }
        };

        const Accessibility = { scanInterval: null, scannableElements: [], currentIndex: -1, inputMode: 'touch', isSwitchDown: false, init() { this.setInputMode(Settings.state.inputMode); window.addEventListener('keydown', this.handleKeyPress.bind(this)); window.addEventListener('keyup', this.handleKeyUp.bind(this)); }, setInputMode(mode) { this.inputMode = mode; this.stopScan(); if (mode !== 'touch') this.startScan(); }, restartScanIfActive() { if (this.inputMode !== 'touch') { this.stopScan(); this.startScan(); } }, startScan() { if (this.inputMode === 'touch') return; const scope = Settings.state.scanScope === 'full' ? '.scannable' : '.game-area .scannable'; this.scannableElements = Array.from(document.querySelector('.view.active').querySelectorAll(scope)); if (this.scannableElements.length === 0) return; this.currentIndex = -1; if (this.inputMode === 'one-button') { this.scanInterval = setInterval(() => this.scanNext(), Settings.state.scanSpeed * 1000); this.scanNext(); } else this.scanNext(); }, stopScan() { clearInterval(this.scanInterval); this.scanInterval = null; this.scannableElements.forEach(el => el.classList.remove('scan-highlight')); this.currentIndex = -1; }, highlightCurrent() { this.scannableElements.forEach((el, index) => el.classList.toggle('scan-highlight', index === this.currentIndex)); }, scanNext() { this.currentIndex = (this.currentIndex + 1) % this.scannableElements.length; this.highlightCurrent(); }, activateCurrent() { if (this.currentIndex > -1 && this.scannableElements[this.currentIndex]) this.scannableElements[this.currentIndex].click(); }, handleKeyPress(e) { if (!['Space', 'ArrowRight', 'Enter'].includes(e.code)) return; e.preventDefault(); if (this.isSwitchDown) return; this.isSwitchDown = true; if (this.inputMode === 'one-button' && e.code === 'Space') this.activateCurrent(); else if (this.inputMode === 'two-button') { if (e.code === 'ArrowRight') this.scanNext(); else if (['Enter', 'Space'].includes(e.code)) this.activateCurrent(); } }, handleKeyUp(e) { if (['Space', 'ArrowRight', 'Enter'].includes(e.code)) this.isSwitchDown = false; } };
        const TTS = { voices: [], init() { speechSynthesis.onvoiceschanged = () => { this.voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('nl')); }; }, speak(text) { if (Settings.state.feedbackMode === 'visual' || !text) return; speechSynthesis.cancel(); const utt = new SpeechSynthesisUtterance(text); const isMale = Settings.state.voice === 'male'; const voice = this.voices.find(v => (isMale ? (v.name.includes('Maarten') || v.gender === 'male') : (v.name.includes('Lotte') || v.gender === 'female'))); utt.voice = voice || this.voices[0]; utt.lang = 'nl-NL'; speechSynthesis.speak(utt); } };
        const Navigation = { init() { document.querySelector('.game-grid').addEventListener('click', e => { const card = e.target.closest('.game-card'); if (!card) return; if (card.id === 'open-settings-from-main') { this.showView('settings-view'); return; } const gameId = card.dataset.game; if (gameId) { AppState.activeLevel = 1; GameController.loadGame(gameId); this.showView('game-view'); } }); document.getElementById('back-to-main-button').addEventListener('click', () => { GameController.unloadGame(); this.showView('main-menu-view'); }); document.getElementById('open-settings-from-game').addEventListener('click', () => this.showView('settings-view')); document.getElementById('close-settings-button').addEventListener('click', () => this.showView(AppState.previousView || 'main-menu-view')); DOM.levelSelector.addEventListener('click', e => { const btn = e.target.closest('.setting-button'); if(btn) { AppState.activeLevel = parseInt(btn.dataset.level); GameController.loadGame(AppState.activeGame); }}); }, showView(viewId) { AppState.previousView = AppState.currentView; AppState.currentView = viewId; DOM.views.forEach(v => v.classList.toggle('active', v.id === viewId)); Accessibility.stopScan(); setTimeout(() => Accessibility.startScan(), 100); } };
        
        const GameController = { loadGame(gameId) { this.unloadGame(); AppState.activeGame = gameId; const game = Games[gameId]; if (game) { if (gameId === 'interactive-scene') { DOM.gameArea.style.backgroundImage = Utils.getThemeItems().background; } this.setupLevelSelector(game.levels); game.create(AppState.activeLevel); TTS.speak(`${game.name}, niveau ${AppState.activeLevel}.`); } }, unloadGame() { if (AppState.activeGame && Games[AppState.activeGame].destroy) Games[AppState.activeGame].destroy(); DOM.gameArea.style.backgroundImage = ''; AppState.activeGame = null; DOM.gameArea.innerHTML = ''; DOM.levelSelector.innerHTML = ''; }, showFeedback(isCorrect) { if (Settings.state.feedbackMode !== 'audio') { DOM.gameFeedback.textContent = isCorrect ? '👍' : '🤔'; DOM.gameFeedback.classList.add('show'); setTimeout(() => DOM.gameFeedback.classList.remove('show'), 1000); } TTS.speak(isCorrect ? 'Goed zo!' : 'Probeer het nog eens.'); }, setupLevelSelector(levels) { DOM.levelSelector.innerHTML = levels.map((_, i) => `<button class="setting-button scannable ${i + 1 === AppState.activeLevel ? 'active' : ''}" data-level="${i + 1}">${i + 1}</button>`).join(''); } };

        // --- GAME DEFINITIES ---
        const Games = {
            'interactive-scene': {
                name: "Ontdek en Tik", levels: [{}, {}, {}],
                create() { DOM.gameArea.innerHTML = `<div id="interactive-scene-container"></div>`; this.setupLevel(); DOM.gameArea.addEventListener('click', this.handleClick.bind(this)); },
                setupLevel() { const container = document.getElementById('interactive-scene-container'); container.innerHTML = ''; const items = Utils.getThemeItems().scenes; const positions = [{top: '20%', left: '15%'}, {top: '50%', left: '60%'}, {top: '30%', left: '40%'}, {top: '65%', left: '10%'}]; Object.entries(items).forEach(([type, item], index) => { const pos = positions[index % positions.length]; const el = document.createElement('div'); el.className = 'interactive-object scannable'; el.textContent = item.i; el.dataset.name = item.n; el.dataset.sound = item.s || ''; el.style.top = pos.top; el.style.left = pos.left; el.dataset.animation = `animate-${type}`; container.appendChild(el); }); Accessibility.restartScanIfActive(); },
                handleClick(e) { const target = e.target.closest('.interactive-object'); if (!target || target.classList.contains('hidden')) return; TTS.speak(target.dataset.sound || target.dataset.name); target.classList.add(target.dataset.animation); target.classList.add('hidden'); setTimeout(() => { target.classList.remove(target.dataset.animation); target.classList.remove('hidden'); }, 3000); }
            },
            'moving-targets': { name: "Vliegende Vangers", levels: [{n: 3, spd: 1}, {n: 5, spd: 2}, {n: 7, spd: 3}], targets: [], animationFrameId: null, create(level) { this.config = this.levels[level - 1]; for (let i = 0; i < this.config.n; i++) this.addTarget(); this.gameLoop(); }, destroy() { cancelAnimationFrame(this.animationFrameId); this.targets = []; }, addTarget() { const el = document.createElement('div'); el.className = 'moving-target scannable'; const item = Utils.getThemeItems().items[Math.floor(Math.random() * 6)]; el.textContent = item.i; const size = DOM.gameArea.getBoundingClientRect(); el.style.left = `${Math.random() * (size.width - 80)}px`; el.style.top = `${Math.random() * (size.height - 80)}px`; DOM.gameArea.appendChild(el); const target = { el, x: parseFloat(el.style.left), y: parseFloat(el.style.top), dx: (Math.random() - 0.5) * this.config.spd, dy: (Math.random() - 0.5) * this.config.spd }; el.addEventListener('click', () => { el.classList.add('caught'); TTS.speak(item.n); setTimeout(() => { el.remove(); this.targets.splice(this.targets.indexOf(target), 1); this.addTarget(); Accessibility.restartScanIfActive(); }, 300); }); this.targets.push(target); }, gameLoop() { const size = DOM.gameArea.getBoundingClientRect(); this.targets.forEach(t => { t.x += t.dx; t.y += t.dy; if (t.x <= 0 || t.x >= size.width - 80) t.dx *= -1; if (t.y <= 0 || t.y >= size.height - 80) t.dy *= -1; t.el.style.left = `${t.x}px`; t.el.style.top = `${t.y}px`; }); this.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this)); } },
            'same-or-different': { name: "Hetzelfde of Anders", levels: [{}, {}, {}], create() { DOM.gameArea.innerHTML = `<div id="sod-container"><div id="sod-reference-area"></div><div id="sod-choice-area"></div></div>`; this.setupLevel(); DOM.gameArea.addEventListener('click', e => { const card = e.target.closest('.sod-choice-card'); if(card) this.checkAnswer(card); }); }, setupLevel() { const items = Utils.shuffleArray([...Utils.getThemeItems().items]); this.correctAnswer = items[0]; document.getElementById('sod-reference-area').innerHTML = `<div class="sod-object">${this.correctAnswer.i}</div>`; const choices = [items[0], items[1], items[2]]; document.getElementById('sod-choice-area').innerHTML = Utils.shuffleArray(choices).map(c => `<div class="sod-choice-card scannable" data-name="${c.n}" data-icon="${c.i}"><div class="sod-object">${c.i}</div></div>`).join(''); Accessibility.restartScanIfActive(); }, checkAnswer(card) { if (card.dataset.icon === this.correctAnswer.i) { GameController.showFeedback(true); setTimeout(() => this.setupLevel(), 1500); } else { TTS.speak(`Dit is ${card.dataset.name}. Probeer het nog eens.`); GameController.showFeedback(false); } } },
            'counting': { name: "Tellen", levels: [{max: 3}, {max: 5}, {max: 10}], create(level) { this.config = this.levels[level - 1]; DOM.gameArea.innerHTML = `<div id="counting-container"><h2>Tel tot: <span id="counting-display"></span></h2><div id="counting-target-area"></div><div id="counting-source-area"></div></div>`; this.setupLevel(); DOM.gameArea.addEventListener('click', e => this.handleSourceClick(e)); }, setupLevel() { this.targetNumber = Math.floor(Math.random() * this.config.max) + 1; this.currentCount = 0; document.getElementById('counting-display').textContent = this.targetNumber; document.getElementById('counting-target-area').innerHTML = ''; const sourceArea = document.getElementById('counting-source-area'); sourceArea.innerHTML = ''; const item = Utils.getThemeItems().items[0]; for (let i = 0; i < this.config.max; i++) sourceArea.innerHTML += `<div class="counting-object scannable">${item.i}</div>`; TTS.speak(`Tel ${this.targetNumber} ${Utils.getThemeItems().name}s.`); Accessibility.restartScanIfActive(); }, handleSourceClick(e) { const target = e.target.closest('.counting-object'); if (!target || this.currentCount >= this.targetNumber) return; target.remove(); document.getElementById('counting-target-area').innerHTML += `<div class="counting-object">${target.textContent}</div>`; this.currentCount++; TTS.speak(this.currentCount); if (this.currentCount === this.targetNumber) { GameController.showFeedback(true); setTimeout(() => this.setupLevel(), 1500); } Accessibility.restartScanIfActive(); } },
            'math': { name: "Rekenen", levels: [{max: 5}, {max: 10}, {max: 20}], create(level) { this.config = this.levels[level - 1]; DOM.gameArea.innerHTML = `<div id="math-container"><div id="math-problem-area"></div><div id="math-answer-area"></div></div>`; this.setupLevel(); DOM.gameArea.addEventListener('click', e => { const btn = e.target.closest('.math-answer-btn'); if(btn) this.checkAnswer(parseInt(btn.textContent)); }); }, setupLevel() { const n1 = Math.ceil(Math.random() * this.config.max); const n2 = Math.ceil(Math.random() * (this.config.max - n1)); this.answer = n1 + n2; const item = Utils.getThemeItems().items[0]; const createGroup = n => `<div class="math-object-group">${Array(n).fill(`<div class="math-object">${item.i}</div>`).join('')}</div>`; document.getElementById('math-problem-area').innerHTML = `${createGroup(n1)}<span>+</span>${createGroup(n2)}<span>=</span><span>?</span>`; const answers = [this.answer]; while (answers.length < 3) { const wrong = Math.floor(Math.random() * this.config.max) + 1; if (wrong > 0 && !answers.includes(wrong)) answers.push(wrong); } document.getElementById('math-answer-area').innerHTML = Utils.shuffleArray(answers).map(a => `<button class="math-answer-btn scannable">${a}</button>`).join(''); TTS.speak(`${n1} plus ${n2} is?`); Accessibility.restartScanIfActive(); }, checkAnswer(val) { if (val === this.answer) { GameController.showFeedback(true); setTimeout(() => this.setupLevel(), 1500); } else GameController.showFeedback(false); } },
            'memory': {
                name: "Memory", levels: [{pairs: 2, cols: 2}, {pairs: 4, cols: 4}, {pairs: 6, cols: 4}],
                flippedCards: [], matchedPairs: 0, lockBoard: false,
                create(level) { this.config = this.levels[level-1]; this.setupLevel(); },
                destroy() { DOM.gameArea.removeEventListener('click', this.boundCardClickHandler); },
                setupLevel() { this.matchedPairs = 0; this.flippedCards = []; this.lockBoard = false; const items = Utils.shuffleArray([...Utils.getThemeItems().items]).slice(0, this.config.pairs); const cards = Utils.shuffleArray([...items, ...items]); const grid = document.createElement('div'); grid.id = 'memory-grid'; grid.style.gridTemplateColumns = `repeat(${this.config.cols}, 1fr)`; DOM.gameArea.innerHTML = ''; DOM.gameArea.appendChild(grid); grid.innerHTML = cards.map(item => `<div class="memory-card scannable" data-item="${item.i}" data-name="${item.n}"><div class="memory-card-face memory-card-back"></div><div class="memory-card-face memory-card-front">${item.i}</div></div>`).join(''); this.boundCardClickHandler = this.handleCardClick.bind(this); DOM.gameArea.addEventListener('click', this.boundCardClickHandler); TTS.speak('Zoek de paren.'); Accessibility.restartScanIfActive(); },
                handleCardClick(e) { const card = e.target.closest('.memory-card'); if (this.lockBoard || !card || card.classList.contains('flipped')) return; TTS.speak(card.dataset.name); card.classList.add('flipped'); this.flippedCards.push(card); if (this.flippedCards.length === 2) { this.lockBoard = true; setTimeout(this.checkMatch.bind(this), 1200); } },
                checkMatch() { const [c1, c2] = this.flippedCards; if (c1.dataset.item === c2.dataset.item) { c1.classList.add('matched'); c2.classList.add('matched'); this.matchedPairs++; GameController.showFeedback(true); if (this.matchedPairs === this.config.pairs) { TTS.speak('Alles gevonden! Heel goed gedaan!'); setTimeout(() => this.setupLevel(), 2500); } } else { c1.classList.remove('flipped'); c2.classList.remove('flipped'); TTS.speak('Die zijn niet hetzelfde. Probeer opnieuw.'); } this.flippedCards = []; this.lockBoard = false; }
            }
        };

        // --- ALLES INITIALISEREN ---
        window.addEventListener('load', () => { Settings.init(); TTS.init(); Accessibility.init(); Navigation.init(); Navigation.showView('main-menu-view'); });
    </script>
</body>
